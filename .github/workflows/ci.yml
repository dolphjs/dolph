name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        adapter: [express, fastify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint
        run: npx eslint "**/*.ts"
      - name: Test
        run: npm test -- --runInBand
        env:
          DOLPH_ADAPTER: ${{ matrix.adapter }}
